<!doctype html>
<html><head><meta charset="utf-8"><title>Onboarding progress preview</title>
<style>
  :root{
    --surface:#fbfaf7; --surface-2:#f0eee9; --border:#d9d5cc; --text:#2c2a26;
    --text-muted:#78736a; --primary:#1e5c55; --primary-dark:#123c37; --on-accent:#fff; --vurd:#b5533a;
    --radius-btn:8px; --font:system-ui, sans-serif;
  }
  body{ background:#e9e6df; font-family:var(--font); padding:24px; color:var(--text); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; width:620px; max-width:92vw; margin:0 auto 18px; }
  h4{ margin:0 0 4px; color:var(--text-muted); font-size:13px; }
  .onboard-progress { overflow: visible; padding: 12px 0 4px; }
  .onboard-journey { display:block; width:100%; max-width:320px; height:auto; margin:0 auto; overflow:visible; }
  .oseg-base { stroke: var(--primary-dark); stroke-width:3; stroke-linecap:round; opacity:0; transition:opacity .35s ease; }
  .oseg.done .oseg-base { opacity:1; }
  .oseg-face { stroke: var(--border); stroke-width:3; stroke-linecap:round; transition: stroke .35s ease; }
  .oseg.done .oseg-face { stroke: var(--primary); }
  .onode-base { fill: var(--primary-dark); opacity:0; transition:opacity .35s ease; }
  .onode.done .onode-base { opacity:1; }
  .onode-face { fill: var(--surface); stroke: var(--border); stroke-width:2.5; transition: fill .35s ease, stroke .35s ease; }
  .onode.done .onode-face { fill: var(--primary); stroke: var(--primary); }
  .onode.current .onode-face { stroke: var(--primary); }
  .onode-hi { fill:#fff; opacity:0; transition:opacity .35s ease; }
  .onode.done .onode-hi { opacity:.4; }
  .onode-goal .onode-face { stroke-width:3; }
  .onode-flagpole { stroke: var(--primary-dark); stroke-width:1.6; stroke-linecap:round; }
  .onode-flag { fill: var(--vurd); }
  .opointer { fill: var(--vurd); transition: transform .4s cubic-bezier(.34,1.4,.5,1); filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.32)); }
  .opointer-hole { fill: var(--surface); }
  .opointer-bob { transform-box:fill-box; transform-origin:bottom center; animation: opointer-bob 1.7s ease-in-out infinite; }
  @keyframes opointer-bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} }
  .opointer-bob.opointer-victory { animation: opointer-victory .8s cubic-bezier(.3,1.5,.5,1); }
  @keyframes opointer-victory { 0%{transform:translateY(0) scale(1)} 22%{transform:translateY(-12px) scale(1.18)} 46%{transform:translateY(0) scale(1)} 64%{transform:translateY(-6px) scale(1.08)} 100%{transform:translateY(0) scale(1)} }
  h4 button{ margin-left:8px; font-size:11px; }
</style></head>
<body>
<div id="root"></div>
<script>
  const ONBOARD_NODES=[[18,32],[65,16],[112,32],[159,16],[206,32],[253,16],[298,32]];
  const ONBOARD_PROGRESS={0:[1,2],1:[1,2],2:[2,3],3:[3,4],4:[4,5],5:[5,6],6:[7,7]};
  const STEP=['Velkommen','Fag','Valgfag','Klasser','Kontaktlærer','Oppsummering','Mål (ferdig)'];
  function buildSvg(){
    let segs='',nodes='';
    for(let j=0;j<ONBOARD_NODES.length-1;j++){const[a,b]=[ONBOARD_NODES[j],ONBOARD_NODES[j+1]];
      segs+=`<g class="oseg" data-j="${j}"><line class="oseg-base" x1="${a[0]}" y1="${a[1]+3}" x2="${b[0]}" y2="${b[1]+3}"/><line class="oseg-face" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/></g>`;}
    ONBOARD_NODES.forEach(([x,y],i)=>{const goal=i===ONBOARD_NODES.length-1;const rx=goal?8.5:6,ry=goal?7:5;
      let g=`<g class="onode${goal?' onode-goal':''}" data-i="${i}"><ellipse class="onode-base" cx="${x}" cy="${y+3}" rx="${rx}" ry="${ry}"/><ellipse class="onode-face" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
      g+= goal ? `<line class="onode-flagpole" x1="${x}" y1="${y-1}" x2="${x}" y2="${y-13}"/><path class="onode-flag" d="M ${x} ${y-13} l 7 2.3 l -7 2.3 z"/>` : `<ellipse class="onode-hi" cx="${x-1.7}" cy="${y-1.6}" rx="1.9" ry="1.4"/>`;
      nodes+=g+'</g>';});
    const pin='<g class="opointer"><g class="opointer-bob"><path class="opointer-body" d="M0 0 C -3 -5 -6 -7.5 -6 -11 A 6 6 0 1 1 6 -11 C 6 -7.5 3 -5 0 0 Z"/><circle class="opointer-hole" cx="0" cy="-11" r="2.4"/></g></g>';
    return `<svg class="onboard-journey" viewBox="0 -14 320 58">${segs}${nodes}${pin}</svg>`;
  }
  function update(el,step){
    const[filled,pn]=ONBOARD_PROGRESS[step];
    el.querySelectorAll('.onode').forEach(c=>{const n=+c.dataset.i+1;c.classList.toggle('done',n<=filled);c.classList.toggle('current',n===pn&&n>filled);});
    el.querySelectorAll('.oseg').forEach(s=>{const far=+s.dataset.j+2;s.classList.toggle('done',far<=filled||far===pn);});
    const p=el.querySelector('.opointer');const[px,py]=ONBOARD_NODES[pn-1];p.style.transform=`translate(${px}px,${py-10}px)`;
  }
  const root=document.getElementById('root');
  for(let s=0;s<=6;s++){
    const card=document.createElement('div');card.className='card';
    const h=document.createElement('h4');h.textContent=`Steg ${s} – ${STEP[s]}`;
    card.appendChild(h);
    const prog=document.createElement('div');prog.className='onboard-progress';prog.innerHTML=buildSvg();
    card.appendChild(prog);root.appendChild(card);update(prog,s);
    if(s===6){const b=document.createElement('button');b.textContent='spill seiersanimasjon';
      b.onclick=()=>{const bob=prog.querySelector('.opointer-bob');bob.classList.remove('opointer-victory');void bob.offsetWidth;bob.classList.add('opointer-victory');};
      h.appendChild(b);}
  }
</script>
</body></html>
